name: test

on:
  pull_request:
  push:
    branches: ['feature/**']

permissions:
  contents: read

jobs:
  # Fails fast with a clear message if the CI database secrets are missing,
  # instead of letting the Postgres service container fail to start in `build`.
  check-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check CI database secrets
        env:
          CI_DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          CI_DATABASE_USERNAME: ${{ secrets.CI_DATABASE_USERNAME }}
          CI_DATABASE_PASSWORD: ${{ secrets.CI_DATABASE_PASSWORD }}
        run: |
          missing=""
          [ -n "$CI_DATABASE_URL" ] || missing="$missing CI_DATABASE_URL"
          [ -n "$CI_DATABASE_USERNAME" ] || missing="$missing CI_DATABASE_USERNAME"
          [ -n "$CI_DATABASE_PASSWORD" ] || missing="$missing CI_DATABASE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. Set them as organization or repository secrets (Secrets and variables -> Actions)."
            exit 1
          fi
          case "$CI_DATABASE_URL" in
            */isaas_test|*/isaas_test\?*) ;;
            *) echo "::error::CI_DATABASE_URL must point at database isaas_test, e.g. jdbc:postgresql://localhost:5432/isaas_test"; exit 1 ;;
          esac

  build:
    needs: check-config
    runs-on: ubuntu-latest
    services:
      # Integration tests run against the real schema, migrated from isaas-database below.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ${{ secrets.CI_DATABASE_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DATABASE_PASSWORD }}
          POSTGRES_DB: isaas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      DATABASE_USERNAME: ${{ secrets.CI_DATABASE_USERNAME }}
      DATABASE_PASSWORD: ${{ secrets.CI_DATABASE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # The schema is owned by isaas-database (public); apply its migrations so the
      # tests exercise the real enums, constraints and triggers.
      - name: Check out isaas-database
        uses: actions/checkout@v4
        with:
          repository: isaas-org/isaas-database
          ref: main
          path: isaas-database

      - name: Apply the database schema
        env:
          DBMATE_VERSION: v2.36.0
          DB_USER: ${{ secrets.CI_DATABASE_USERNAME }}
          DB_PASSWORD: ${{ secrets.CI_DATABASE_PASSWORD }}
        run: |
          sudo curl -fsSL -o /usr/local/bin/dbmate \
            "https://github.com/amacneil/dbmate/releases/download/${DBMATE_VERSION}/dbmate-linux-amd64"
          sudo chmod +x /usr/local/bin/dbmate
          password=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["DB_PASSWORD"], safe=""))')
          dbmate --url "postgres://${DB_USER}:${password}@localhost:5432/isaas_test?sslmode=disable" \
            --migrations-dir isaas-database/db/migrations --no-dump-schema up

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify
