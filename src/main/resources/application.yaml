spring:
  application:
    name: buyer-catalog-browsing-backend
  datasource:
    # Local default matches isaas-database's docker-compose (seeded with db/seeds).
    # For Neon, use the pooled host in JDBC form:
    #   jdbc:postgresql://<host>-pooler.<region>.aws.neon.tech/<db>?sslmode=require
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/isaas_dev}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Auth0 dev tenant (isaas-auth0-config). The trailing slash is part of
          # Auth0's issuer and must match the token's iss claim exactly.
          issuer-uri: ${AUTH0_ISSUER_URI:https://isaas-dev.us.auth0.com/}
          audiences: ${AUTH0_AUDIENCE:https://api.isaas/buyer}
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned and migrated by isaas-database. Never let Hibernate change it.
      ddl-auto: none

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
